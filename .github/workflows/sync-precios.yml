name: Precios de CardMarket

on:
  schedule:
    # CardMarket publica el Price Guide hacia las 02:50 (París). Se ejecuta a las 03:30 UTC.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Repetir aunque ya esté guardado el Price Guide de hoy"
        type: boolean
        default: false

concurrency:
  group: sync-precios
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sincronizar precios
        run: node scripts/sync-precios.mjs ${{ inputs.force && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
